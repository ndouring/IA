<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
  </style>
</helmet>
<div style="height:76px"></div>
<header style="position:fixed;top:0;left:0;right:0;z-index:100;background:#ffffff;border-bottom:1px solid #e8e8e4;font-family:'Inter',sans-serif">
  <div style="max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;gap:24px">
    <a href="Accueil.dc.html" style="display:flex;align-items:center;gap:0;flex-shrink:0">
      <img src="assets/deprice-logo.jpg" alt="DEPRICE Consulting" style="height:46px;width:auto;object-fit:contain;mix-blend-mode:multiply"/>
    </a>
    <sc-if value="{{isNarrow}}" hint-placeholder-val="{{false}}">
      <button onClick="{{toggleMobile}}" style="background:none;border:none;cursor:pointer;padding:8px;display:flex;flex-direction:column;gap:5px" aria-label="Menu">
        <span style="width:26px;height:2px;background:#121212;display:block"></span>
        <span style="width:26px;height:2px;background:#121212;display:block"></span>
        <span style="width:26px;height:2px;background:#121212;display:block"></span>
      </button>
    </sc-if>
    <sc-if value="{{isDesktopNav}}" hint-placeholder-val="{{true}}">
      <nav style="display:flex;align-items:center;gap:28px">
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:5px">
          <a href="Accueil.dc.html" style="{{navLinkStyle.home}}" style-hover="{{navHoverStyle}}">Accueil</a>
          <sc-if value="{{navActive.home}}" hint-placeholder-val="{{false}}"><span style="width:100%;height:2px;background:#7ED321"></span></sc-if>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:5px">
          <a href="APropos.dc.html" style="{{navLinkStyle.about}}" style-hover="{{navHoverStyle}}">À propos</a>
          <sc-if value="{{navActive.about}}" hint-placeholder-val="{{false}}"><span style="width:100%;height:2px;background:#7ED321"></span></sc-if>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:5px">
          <a href="ExpertiseServices.dc.html" style="{{navLinkStyle.expertise}}" style-hover="{{navHoverStyle}}">Expertise &amp; Services</a>
          <sc-if value="{{navActive.expertise}}" hint-placeholder-val="{{false}}"><span style="width:100%;height:2px;background:#7ED321"></span></sc-if>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:5px">
          <a href="FormationsCertifications.dc.html" style="{{navLinkStyle.formations}}" style-hover="{{navHoverStyle}}">Formations &amp; Certifications</a>
          <sc-if value="{{navActive.formations}}" hint-placeholder-val="{{false}}"><span style="width:100%;height:2px;background:#7ED321"></span></sc-if>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:5px">
          <a href="References.dc.html" style="{{navLinkStyle.references}}" style-hover="{{navHoverStyle}}">Références</a>
          <sc-if value="{{navActive.references}}" hint-placeholder-val="{{false}}"><span style="width:100%;height:2px;background:#7ED321"></span></sc-if>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:5px">
          <a href="Contact.dc.html" style="{{navLinkStyle.contact}}" style-hover="{{navHoverStyle}}">Contact</a>
          <sc-if value="{{navActive.contact}}" hint-placeholder-val="{{false}}"><span style="width:100%;height:2px;background:#7ED321"></span></sc-if>
        </div>
      </nav>
      <div style="display:flex;align-items:center;gap:18px;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:2px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600">
          <button onClick="{{setLangFr}}" style="{{langBtnStyle.fr}}">FR</button>
          <span style="color:#ccc">/</span>
          <button onClick="{{setLangEn}}" style="{{langBtnStyle.en}}">EN</button>
        </div>
        <a href="Contact.dc.html" style="background:#121212;color:#ffffff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;padding:11px 22px;border-radius:2px;text-decoration:none;white-space:nowrap">Demander un devis</a>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{mobileOpen}}" hint-placeholder-val="{{false}}">
    <nav style="display:flex;flex-direction:column;padding:8px 28px 24px;border-top:1px solid #e8e8e4;font-family:'Inter',sans-serif">
      <a href="Accueil.dc.html" style="padding:12px 0;color:#121212;text-decoration:none;font-size:15px;border-bottom:1px solid #f0f0ee">Accueil</a>
      <a href="APropos.dc.html" style="padding:12px 0;color:#121212;text-decoration:none;font-size:15px;border-bottom:1px solid #f0f0ee">À propos</a>
      <a href="ExpertiseServices.dc.html" style="padding:12px 0;color:#121212;text-decoration:none;font-size:15px;border-bottom:1px solid #f0f0ee">Expertise &amp; Services</a>
      <a href="FormationsCertifications.dc.html" style="padding:12px 0;color:#121212;text-decoration:none;font-size:15px;border-bottom:1px solid #f0f0ee">Formations &amp; Certifications</a>
      <a href="References.dc.html" style="padding:12px 0;color:#121212;text-decoration:none;font-size:15px;border-bottom:1px solid #f0f0ee">Références</a>
      <a href="Contact.dc.html" style="padding:14px 0 0;color:#121212;text-decoration:none;font-size:15px;font-weight:600">Contact →</a>
    </nav>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;expertise&quot;,&quot;formations&quot;,&quot;references&quot;,&quot;contact&quot;]}}">

class Component extends DCLogic {
  state = { mobileOpen: false, servicesOpen: false, isNarrow: false, lang: 'fr' };

  componentDidMount() {
    this.check = () => this.setState({ isNarrow: window.innerWidth < 920 });
    this.check();
    window.addEventListener('resize', this.check);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.check);
  }

  renderVals() {
    const current = this.props.current || 'home';
    const green = '#7ED321';
    const activeStyle = { fontWeight: 600, color: green };
    const baseStyle = { fontSize: '14px', color: '#000000', textDecoration: 'none', fontWeight: 500, transition: 'color .15s' };
    const hoverStyle = { color: green };
    const linkStyle = (key) => ({ ...baseStyle, ...(current === key ? activeStyle : {}) });
    const isActive = (key) => current === key;

    return {
      isNarrow: this.state.isNarrow,
      isDesktopNav: !this.state.isNarrow,
      mobileOpen: this.state.isNarrow && this.state.mobileOpen,
      toggleMobile: () => this.setState(s => ({ mobileOpen: !s.mobileOpen })),
      navLinkStyle: {
        home: linkStyle('home'), about: linkStyle('about'), expertise: linkStyle('expertise'),
        formations: linkStyle('formations'), references: linkStyle('references'), contact: linkStyle('contact')
      },
      navHoverStyle: hoverStyle,
      navActive: {
        home: isActive('home'), about: isActive('about'), expertise: isActive('expertise'),
        formations: isActive('formations'), references: isActive('references'), contact: isActive('contact')
      },
      langBtnStyle: {
        fr: { border: 'none', background: 'none', cursor: 'pointer', color: this.state.lang === 'fr' ? '#121212' : '#b5b5b0', padding: '4px' },
        en: { border: 'none', background: 'none', cursor: 'pointer', color: this.state.lang === 'en' ? '#121212' : '#b5b5b0', padding: '4px' }
      },
      setLangFr: () => this.setState({ lang: 'fr' }),
      setLangEn: () => this.setState({ lang: 'en' })
    };
  }
}

</script>
</body>
</html>
